# copyparty config with the Nagi theme.  run:  copyparty -c copyparty.conf
# replace the paths, the account and the password before use.

[global]
  p: 3979                     # port
  i: 127.0.0.1                # listen on localhost only (add your tailscale ip, see README)
  usernames                   # log in with username + password
  name: nagi
  no-robots
  shr: /shr                   # share links
  e2dsa                       # file index (search, up2k dedup); skip on huge or cloud-synced folders
  e2ts                        # media tags (artist/title in the music player)
  u2j: 4                      # parallel upload chunks, helps over the internet / tailscale

  # Nagi
  themes: 12
  theme: 11
  css-browser: /.nagi/nagi.css
  js-browser: /.nagi/nagi.js
  js-other: /.nagi/nagi-pages.js
  html-head-s: <link rel="stylesheet" href="/.nagi/nagi-pages.css"><link rel="manifest" href="/.nagi/manifest.json"><link rel="apple-touch-icon" href="/.nagi/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nagi"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  favico: 凪 17282B EEE5D1

[accounts]
  alice: CHANGE-ME-to-a-long-password

[/]
  /path/to/your/files
  accs:
    r: *                      # guests can browse and download
    rwmda: alice              # alice can upload, move, delete, admin

[/.nagi]
  /path/to/nagi/theme         # the theme/ folder of this repo
  accs:
    r: *
