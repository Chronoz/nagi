# copyparty config with the Nagi theme.  run:  copyparty -c copyparty.conf
# replace the paths, the account and the password before use.

[global]
  p: 3979                     # port
  i: 127.0.0.1                # listen on localhost only (or 127.0.0.1, <tailnet ip>)
  usernames                   # log in with username + password
  name: nagi
  no-robots
  shr: /shr                   # share links
  e2dsa                       # file index (search, up2k dedup); skip on huge or cloud-synced folders
  # for Dropbox / iCloud, prefer: e2d + e2ds + 'no-hash: .*' and hist/dbpath outside the synced folder
  e2ts                        # media tags (artist/title in the music player)
  u2j: 4
  th-ff-jpg                   # ffmpeg without libwebp: jpeg thumbs
  th-mt: 2                     # thumbnail worker processes
  md-hist: v                   # markdown edit history in the volume hist folder, not next to the file
  rw-edit: md,txt              # write without delete can still edit notes

  # Nagi
  themes: 12
  theme: 11
  css-browser: /.nagi/nagi-boot.css?nagi=4aa84c116d&cache=31536000
  js-browser: /.nagi/nagi-late.js?nagi=4b7d437385&cache=31536000
  js-other: /.nagi/nagi-pages.js?nagi=221bdcb2f2&cache=31536000
