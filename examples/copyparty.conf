# copyparty config with the Nagi theme.  run:  copyparty -c copyparty.conf
# replace the paths, the account and the password before use.

[global]
  p: 3979                     # port
  i: 127.0.0.1                # listen on localhost only (or 127.0.0.1, <tailnet ip>)
  usernames                   # log in with username + password
  name: nagi
  no-robots
  shr: /shr                   # share links
  e2dsa                       # file index (search, up2k dedup); skip on huge or cloud-synced folders
  # for Dropbox / iCloud, prefer: e2d + e2ds + 'no-hash: .*' and hist/dbpath outside the synced folder
  e2ts                        # media tags (artist/title in the music player)
  u2j: 4
  th-ff-jpg                   # ffmpeg without libwebp: jpeg thumbs
  th-mt: 2                     # thumbnail worker processes
  md-hist: v                   # markdown edit history in the volume hist folder, not next to the file
  rw-edit: md,txt              # write without delete can still edit notes

  # Nagi
  themes: 12
  theme: 11
  css-browser: /.nagi/nagi.css?nagi=f741974eae&cache=31536000
  js-browser: /.nagi/nagi-late.js?nagi=72a233c738&cache=31536000
  js-other: /.nagi/nagi-pages.js?nagi=94536693d1&cache=31536000
  html-head-s: <link rel="stylesheet" href="/.nagi/nagi-pages.css?nagi=feede5270a&cache=31536000"><link rel="manifest" href="/.nagi/manifest.json?nagi=b8ef2fba1e&cache=31536000"><link rel="apple-touch-icon" href="/.nagi/icon-180.png?nagi=88d99dbc9b&cache=31536000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nagi"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script nonce="{{ js_nonce }}" src="/.nagi/nagi-early.js?nagi=8d2ff78d8d&cache=31536000"></script><script nonce="{{ js_nonce }}" src="/.nagi/nagi.js?nagi=6281709725&cache=31536000"></script>
  favico: 凪 17282B EEE5D1

[accounts]
  alice: CHANGE-ME-to-a-long-password

[/]
  /path/to/your/files
  accs:
    r: *                      # guests can browse and download
    rwmda.: alice             # alice can upload, move, delete, admin, and show hidden files (the trailing ".")

[/.nagi]
  /path/to/nagi/theme         # the theme/ folder of this repo
  accs:
    r: *
  flags:
    d2d                       # don't index the theme itself
    # optional Smart search (see ext/README.md). colon, not equals:
    # on404: /path/to/nagi/ext/nagi-search.py
