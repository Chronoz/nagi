/* ===== 凪 Nagi app v3: a full-bleed paper page with a field of river pebbles (Kanso-like) ===== */
#nagi{position:fixed;inset:0;z-index:50;font:400 14px/1.5 var(--n-ui);color:var(--n-ink);-webkit-font-smoothing:antialiased;background:var(--w-bg);
 --w-bg:#F1EADB;--w-bg2:#E8DFCC;--w-line:#DDD3BE;--w-veil:rgba(241,234,219,.62);
 --p1:#22302F;--p2:#7D8984;--p3:#DCD3C0;--p3s:#CEC4AE;--pt1:#F1EADB;--pt2:#F6F1E6;--pt3:#22302F;
 --on-dark:#F3ECDD;--on-light:#17282B;--contour:#55625F;--gapc:var(--w-bg)}
html.fz #nagi{--w-bg:#0F1D1E;--w-bg2:#162A2A;--w-line:#22393A;--w-veil:rgba(10,20,20,.6);
 --p1:#E4DAC4;--p2:#6C8781;--p3:#2A4444;--p3s:#365252;--pt1:#10201F;--pt2:#F1EADB;--pt3:#DCD3C0;
 --on-dark:#EFE6D2;--on-light:#10201F;--contour:#B9C5B9}
#nagi *{box-sizing:border-box}
#nagi button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;height:auto;border-radius:0;box-shadow:none}
#nagi .ni{display:inline-block;width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;background:currentColor;-webkit-mask:var(--ni) center/contain no-repeat;mask:var(--ni) center/contain no-repeat}
#nagi .win{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
/* top line: wordmark left, text menus right */
#nagi .tb{height:58px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 40px 0 44px;user-select:none}
#nagi .ttl{font:600 14px var(--n-ui);color:var(--n-ink);letter-spacing:-.005em;display:flex;align-items:baseline;gap:7px}
#nagi .ttl .k{font:500 14px "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif;color:var(--n-mute)}
#nagi .menu{display:flex;align-items:center;gap:2px}
#nagi .menu button{font-size:13.5px;color:var(--n-ink2);padding:6px 10px;border-radius:7px;transition:color .15s,background .15s}
#nagi .menu button:hover,#nagi .menu button.on{color:var(--n-ink);background:var(--w-bg2)}
#nagi .menu .sep{width:1px;height:14px;background:var(--w-line);margin:0 8px}
#nagi .menu .me{display:flex;align-items:center;gap:8px}
#nagi .menu .me{gap:8px;padding:4px 10px 4px 4px;border-radius:999px}
#nagi .menu .me b{width:22px;height:22px;border-radius:50%;background:var(--n-ink);color:var(--w-bg);font:600 11px var(--n-ui);display:grid;place-items:center}
#nagi .menu .me b.g{background:transparent;color:var(--n-ink2);box-shadow:inset 0 0 0 1.2px var(--n-ink2)}#nagi .menu .me b.g .ni{width:12px;height:12px}
#nagi .menu .me span{font-size:13.5px}
#nagi .mb{display:none}
/* body: the field covers everything; the context column floats top-left and the pebbles flow around and under it */
#nagi .bd{flex:1;min-height:0;position:relative}
#nagi .gd{position:absolute;inset:4px 36px 14px 40px;display:flex;flex-direction:column}
#nagi .ctx{position:absolute;left:44px;top:6px;width:clamp(320px,27vw,404px);display:flex;flex-direction:column;z-index:3}
#nagi .drawer-h{display:none}
#nagi .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font:500 12px/1 var(--n-ui);color:var(--n-mute);min-height:16px}
#nagi .crumb a{color:var(--n-mute);text-decoration:none;padding:3px 4px;margin:-3px -4px;border-radius:5px;cursor:pointer}
#nagi .crumb a:hover{color:var(--n-ink);background:var(--w-bg2)}
#nagi .crumb a:last-child{color:var(--n-ink2)}
#nagi .crumb .s{opacity:.45;margin:0 6px}
#nagi .num{display:flex;align-items:baseline;gap:0;margin:8px 0 14px;color:var(--n-ink);white-space:nowrap}
#nagi .num .big{font:300 76px/1 var(--n-ui);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
#nagi .num small{font:400 19px var(--n-ui);color:var(--n-ink2);margin-left:8px}
#nagi .num .note{font-size:13px;line-height:1.35;color:var(--n-ink2);margin-left:18px;white-space:normal;max-width:170px;align-self:center}
#nagi .say{font:500 18.5px/1.45 var(--n-ui);color:var(--n-ink);margin:2px 0 6px;letter-spacing:-.012em;text-wrap:pretty}
#nagi .say em{font-style:normal;color:var(--n-window)}
#nagi .para{font-size:13px;line-height:1.55;color:var(--n-ink2);margin:0 0 14px;text-wrap:pretty}
#nagi .meter{display:none}
#nagi .say,#nagi .para,#nagi .ctx.open .para{display:none!important}
#nagi .chh{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;font:600 13px var(--n-ui);color:var(--n-ink);padding:0 0 8px;border-bottom:1px solid var(--w-line)}
#nagi .chh .h1 b{font-size:10px;margin-right:9px;vertical-align:1px}
#nagi .chh .h2{font-weight:600;font-variant-numeric:tabular-nums}
#nagi .chh .sa{font-weight:500;color:var(--n-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;cursor:pointer}
#nagi .chk{min-height:0;margin:0 -8px;padding:0 8px}
#nagi .row{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:11px;min-height:34px;border-bottom:1px solid var(--w-line);cursor:pointer;padding:0 4px;margin:0 -4px;border-radius:5px;transition:background .15s}
#nagi .row:hover,#nagi .row.hov{background:var(--w-bg2)}
#nagi .row .cb{width:16px;height:16px;border-radius:4px;border:1.3px solid var(--n-ink2);display:grid;place-items:center;transition:all .15s;color:var(--w-bg)}
#nagi .row.sel .cb{background:var(--n-ink);border-color:var(--n-ink)}
#nagi .row .cb .ni{width:11px;height:11px;opacity:0}#nagi .row.sel .cb .ni{opacity:1}
#nagi .row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:var(--n-ink)}
#nagi .row .nm i{font-style:normal;color:var(--n-faint);margin-left:6px;font-size:12px}
#nagi .row .sz{font-size:13px;color:var(--n-ink);font-variant-numeric:tabular-nums}
#nagi .row.more{color:var(--n-mute);font-size:12.5px;grid-template-columns:1fr;cursor:default}
#nagi .row.play .nm{color:var(--n-window)}
#nagi .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#nagi .acts2{margin-top:6px}
